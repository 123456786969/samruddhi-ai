<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully handle benign Vite HMR WebSocket disconnection errors in sandbox iframe
      window.addEventListener('unhandledrejection', function (e) {
        var msg = (e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('vite:ws') ||
          msg.includes('@vite/client') ||
          msg.includes('closed without opened')
        ) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = e.message || '';
        var filename = e.filename || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('vite:ws') ||
          filename.includes('@vite/client') ||
          msg.includes('closed without opened')
        ) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
    </script>
    <title>Samruddhi AI — Autonomous Real Estate Voice & WhatsApp Engine</title>
    <meta name="description" content="Ultra-high performance AI Voice agents and automated WhatsApp workflows designed for modern real estate developers and top channel partners." />
    <!-- Google Fonts: Playfair Display (Serif), Plus Jakarta Sans (Sans), JetBrains Mono (Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body class="bg-[#0A0A0A] text-[#F4F4F5]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
